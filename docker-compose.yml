services:
  postgres:
    image: postgres:latest
    container_name: tokmall-postgres
    environment:
      POSTGRES_USER: tokmall
      POSTGRES_PASSWORD: tokmall
      POSTGRES_DB: tokmall
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # 命名卷：容器重建（改端口、升级镜像）不清空数据；清空需显式 docker compose down -v。
      - pg-data:/var/lib/postgresql

  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: tokmall-rustfs
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-tokmall}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-tokmall123}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    # 固定小版本避免隐式升级；8.x 的 Streams / XAUTOCLAIM / XPENDING 语义与 7.4 一致。
    image: redis:8-alpine
    container_name: tokmall-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  # 观测栈：默认不启动（profile: monitoring），用 `make monitoring` 起。
  # 应用指标由 bin/api 在宿主机暴露 127.0.0.1:9091，容器通过 host.docker.internal 访问。
  prometheus:
    image: prom/prometheus:latest
    container_name: tokmall-prometheus
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d

  grafana:
    image: grafana/grafana:latest
    container_name: tokmall-grafana
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  rustfs-data:
  pg-data:
  redis-data:
