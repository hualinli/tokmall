services:
  postgres:
    image: postgres:latest
    container_name: tokmall-postgres
    environment:
      POSTGRES_USER: tokmall
      POSTGRES_PASSWORD: tokmall
      POSTGRES_DB: tokmall
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    container_name: tokmall-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tokmall
      MINIO_ROOT_PASSWORD: tokmall123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  redis:
    image: redis:7
    container_name: tokmall-redis
    ports:
      - "6380:6379"

volumes:
  minio-data:
