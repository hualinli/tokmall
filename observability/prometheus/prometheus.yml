# Prometheus 抓取配置（本地观测栈，可选启动：make monitoring）。
#
# 与同类项目（DomTok）的差别：它的 7 个抓取目标全是基础设施 exporter，
# 应用自己不暴露任何指标（Grafana 里的"Go 面板"实际查的是 cadvisor 容器指标）。
# 这里第一个 job 就是应用自身：TokMall 的 db_pool / outbox / reconcile /
# existence / breaker / http 指标全部由应用埋点产生。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: tokmall

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # 应用指标（宿主机上的 bin/api 监听 127.0.0.1:9091）。
  # 容器里用 host.docker.internal 访问宿主机；Linux 上换成宿主网关 IP。
  - job_name: tokmall-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels:
          env: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
