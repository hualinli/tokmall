openapi: 3.0.3
info:
  title: TokMall API
  description: 短视频 Feed + 商城一体化后端（学习项目）。
    本文件是 API 契约的唯一事实源，由 openapi_sync_test 保证与代码同步。
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: 本地开发

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 认证（公开）
  - name: feed
    description: 全局 Feed（公开）
  - name: videos
    description: 视频管理（需认证）
  - name: interactions
    description: 点赞/关注（需认证）
  - name: user
    description: 个人资料（需认证）
  - name: health
    description: 探针（公开）

paths:
  /health/live:
    get:
      tags: [health]
      summary: 存活探针
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      tags: [health]
      summary: 就绪探针（检查 DB 连通）
      responses:
        "200":
          description: 依赖就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/v1/docs/openapi.yaml:
    get:
      tags: [health]
      summary: 本 OpenAPI 规范文件本身
      security: []
      responses:
        "200":
          description: 原始 YAML
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: 注册（注册即签发 token 对）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "409":
          $ref: "#/components/responses/DuplicateAction"
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录（identifier 接受 email 或 username）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新 token（rotation：旧 refresh token 被拉黑）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 新的 token 对
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 登出（幂等：无效/过期 token 视为已登出）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: 登出成功
        "400":
          $ref: "#/components/responses/InvalidArgument"

  /api/v1/feed:
    get:
      tags: [feed]
      summary: 全局时间排序 Feed（首页走缓存，翻页用 cursor）
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页已发布视频
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"

  /api/v1/feed/following:
    get:
      tags: [feed]
      summary: 关注 Feed（拉模式：每作者 TOP 5 + 全局排序，需登录）
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页关注作者的已发布视频
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/me:
    get:
      tags: [user]
      summary: 当前用户资料（含 email，仅自己可见）
      responses:
        "200":
          description: 用户资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/UserNotFound"
    patch:
      tags: [user]
      summary: 更新自己的资料（bio / avatar_key，局部更新语义）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: 更新后的完整资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/users/{id}:
    get:
      tags: [user]
      summary: 公开用户资料（可选认证：带 token 时 is_following 个性化）
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: 公开资料（不含 email）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /api/v1/users/{id}/videos:
    get:
      tags: [feed]
      summary: 公开作者主页：已发布作品列表（FeedItem 结构，游标分页）
      security: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 该作者的已发布视频
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"

  /api/v1/users/{id}/following:
    get:
      tags: [interactions]
      summary: 关注列表（可选认证：is_following 个性化）
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 关注的人（按关系时间倒序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileListResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
  /api/v1/users/{id}/followers:
    get:
      tags: [interactions]
      summary: 粉丝列表（可选认证：is_following 个性化，回关按钮数据）
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 粉丝（按关系时间倒序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileListResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"

  /api/v1/videos/upload-url:
    post:
      tags: [videos]
      summary: 申请预签名上传 URL（含票证防伪造）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadURLRequest"
      responses:
        "200":
          description: 预签名 PUT URL（15 分钟有效）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/videos:
    post:
      tags: [videos]
      summary: 创建视频记录（需先上传文件到 object_key）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoRequest"
      responses:
        "201":
          description: 创建成功（PENDING_REVIEW）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateResult"
        "400":
          description: 参数非法或上传凭证过期/伪造
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/videos/me:
    get:
      tags: [videos]
      summary: 我的视频列表（管理视图，含未发布；按创建时间倒序）
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 作者自己的视频列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoListResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/videos/{id}:
    get:
      tags: [videos]
      summary: 视频详情（公开可看；可见性：DELETED 404，未发布仅作者；is_liked 可选认证）
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "200":
          description: 详情（video_url 为预签名播放 URL，2 小时有效）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoDetail"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/VideoNotFound"
    delete:
      tags: [videos]
      summary: 删除视频（软删 + 删除 MinIO 对象，旧 URL 立即失效）
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "204":
          description: 删除成功
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/VideoNotFound"
        "409":
          $ref: "#/components/responses/DuplicateAction"
  /api/v1/videos/{id}/publish:
    post:
      tags: [videos]
      summary: 发布视频（PENDING_REVIEW -> PUBLISHED，条件更新防并发）
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "200":
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/VideoNotFound"
        "409":
          $ref: "#/components/responses/DuplicateAction"
  /api/v1/videos/{id}/play:
    post:
      tags: [videos]
      summary: 上报播放事件（幂等：event_id 去重；M5 前同步落库，之后改 Kafka）
      parameters:
        - $ref: "#/components/parameters/VideoID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayRequest"
      responses:
        "204":
          description: 事件已接收（重复 event_id 同样 204，不重复计数）
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/VideoNotFound"
  /api/v1/videos/{id}/like:
    post:
      tags: [interactions]
      summary: 点赞（幂等：重复点赞返回相同结果）
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "200":
          description: 点赞结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    delete:
      tags: [interactions]
      summary: 取消点赞（幂等）
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "200":
          description: 取消点赞结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/users/{id}/follow:
    post:
      tags: [interactions]
      summary: 关注（幂等，禁止自关注）
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: 关注结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    delete:
      tags: [interactions]
      summary: 取消关注（幂等）
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: 取消关注结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/products:
    post:
      tags: [products]
      summary: 创建商品（商家；初始 ON_SALE）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "200":
          description: 创建成功（cover_url 为预签名 URL，短时效）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductItem"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    get:
      tags: [products]
      summary: 我的商品列表（商家管理视图，不含已删除；id 倒序 + before_id 游标）
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/BeforeID"
        - name: status
          in: query
          description: 状态过滤（缺省返回全部非删除状态）
          schema:
            type: string
            enum: [ON_SALE, OFF_SALE]
        - name: keyword
          in: query
          description: 标题模糊匹配
          schema:
            type: string
      responses:
        "200":
          description: 商品列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/products/search:
    get:
      tags: [products]
      summary: 商品搜索（用户侧，仅 ON_SALE；匿名可用）
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/BeforeID"
        - name: keyword
          in: query
          description: 标题模糊匹配（可选，缺省浏览全部在售商品）
          schema:
            type: string
      responses:
        "200":
          description: 在售商品列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"

  /api/v1/products/{id}:
    get:
      tags: [products]
      summary: 商品详情（公开可看；DELETED 对外 404；skus 仅含在售规格）
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProductID"
      responses:
        "200":
          description: 商品详情（含在售 SKU 列表）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/ProductNotFound"

  /api/v1/products/{id}/status:
    post:
      tags: [products]
      summary: 变更商品状态（仅商家本人；ON_SALE/OFF_SALE 互转或软删 DELETED）
      parameters:
        - $ref: "#/components/parameters/ProductID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeStatusRequest"
      responses:
        "200":
          description: 状态变更成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductItem"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ProductNotFound"
  /api/v1/products/{id}/skus:
    post:
      tags: [products]
      summary: 给商品新增 SKU（仅商家本人；初始 ACTIVE）
      parameters:
        - $ref: "#/components/parameters/ProductID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSKURequest"
      responses:
        "201":
          description: 创建成功（价格为分）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SKUItem"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ProductNotFound"

  /api/v1/products/{id}/skus/{sku_id}/status:
    post:
      tags: [products]
      summary: 变更 SKU 状态（仅商家本人；ACTIVE/DISABLED 互转）
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/SkuID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeSKUStatusRequest"
      responses:
        "200":
          description: 状态变更成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SKUItem"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "409":
          description: 状态已被并发修改
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/products/{id}/skus/{sku_id}/stock:
    get:
      tags: [products]
      summary: 查询 SKU 库存（仅商家本人；未初始化按 0 返回）
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/SkuID"
      responses:
        "200":
          description: 当前库存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockView"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ProductNotFound"
    post:
      tags: [products]
      summary: 调整 SKU 库存（仅商家本人；正数入库、负数扣减；以 idempotency_key 幂等）
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/SkuID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustStockRequest"
      responses:
        "200":
          description: 调整后的当前库存（重复 key 幂等重放也返回 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockView"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "409":
          description: 库存不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      description: 每页条数，默认 20，合法范围 1-100
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      description: 上一页返回的签名游标（无则取第一页）
      schema:
        type: string
    VideoID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProductID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    BeforeID:
      name: before_id
      in: query
      description: 上一页最后一条的商品 ID（无则取第一页）
      schema:
        type: integer
        format: int64
    SkuID:
      name: sku_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    InvalidArgument:
      description: 参数非法（details 指明字段）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: 未认证或凭证无效（token 缺失/过期/黑名单）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    VideoNotFound:
      description: 视频不存在或不可见（404 不泄露存在性）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UserNotFound:
      description: 用户不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProductNotFound:
      description: 商品不存在或不可见（404 不泄露存在性）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DuplicateAction:
      description: 重复操作（邮箱/用户名已存在、状态冲突）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: 统一错误结构
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_ARGUMENT, INVALID_CURSOR, VIDEO_NOT_FOUND, VIDEO_NOT_PUBLISHED,
                USER_NOT_FOUND, PRODUCT_NOT_FOUND, INSUFFICIENT_STOCK, UNAUTHENTICATED,
                FORBIDDEN, RATE_LIMITED, DUPLICATE_ACTION, UPLOAD_URL_EXPIRED, INTERNAL,
                DEPENDENCY_UNAVAILABLE, MISSING_AUTH_HEADER, INVALID_AUTH_TYPE, INVALID_TOKEN]
            message:
              type: string
            details:
              type: object
        request_id:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string

    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          pattern: "^[a-zA-Z][a-zA-Z0-9]{5,15}$"
          description: 字母开头，5-15 位字母数字
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8-72 字节（bcrypt 上限）
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: email 或 username
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    AuthResult:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token:
          type: string
          description: JWT，15 分钟有效
        refresh_token:
          type: string
          description: JWT，7 天有效；刷新后旧 token 立即失效
        expires_in:
          type: integer
          format: int64
          description: access_token 剩余秒数
        user:
          $ref: "#/components/schemas/PublicUser"
    PublicUser:
      type: object
      required: [user_id, email, username, bio, avatar_key, avatar_url]
      properties:
        user_id:
          type: integer
          format: int64
        email:
          type: string
        username:
          type: string
        bio:
          type: string
        avatar_key:
          type: string
          nullable: true
          description: MinIO key，仅用于 PATCH /me 回传
        avatar_url:
          type: string
          nullable: true
          description: 可显示的预签名 URL（7 天有效），导航栏/个人页直接用
    PublicProfile:
      type: object
      description: 公开资料（不含 email）
      required: [user_id, username, bio, avatar_url, following_count, followers_count, is_following, is_me]
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        bio:
          type: string
        avatar_url:
          type: string
          nullable: true
          description: 预签名 URL（7 天有效）
        following_count:
          type: integer
          format: int64
        followers_count:
          type: integer
          format: int64
        is_following:
          type: boolean
          description: 当前用户是否已关注（匿名 false）
        is_me:
          type: boolean
    UpdateMeRequest:
      type: object
      description: 局部更新：缺省字段不更新
      properties:
        bio:
          type: string
        avatar_key:
          type: string
          description: 必须来自 /videos/upload-url（图片类型）发放的 key
    ProfileItem:
      type: object
      description: 关注/粉丝列表项（不含计数，避免 N+1）
      required: [user_id, username, bio, avatar_url, is_following, is_me]
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        bio:
          type: string
        avatar_url:
          type: string
          nullable: true
        is_following:
          type: boolean
        is_me:
          type: boolean
    ProfileListResult:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProfileItem"
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    UploadURLRequest:
      type: object
      required: [filename, file_size, content_type]
      properties:
        filename:
          type: string
        file_size:
          type: integer
          format: int64
          description: 视频 1MB-512MB；图片 1KB-5MB
        content_type:
          type: string
          enum: [video/mp4, video/webm, video/quicktime, image/jpeg, image/png, image/webp]
    UploadResult:
      type: object
      required: [object_key, upload_url, expires_at]
      properties:
        object_key:
          type: string
          description: 创建视频时必须回传
        upload_url:
          type: string
          description: 预签名 PUT URL（15 分钟有效）
        expires_at:
          type: string
          format: date-time
    CreateVideoRequest:
      type: object
      required: [title, object_key, duration_seconds]
      properties:
        title:
          type: string
          maxLength: 200
        object_key:
          type: string
        cover_key:
          type: string
          nullable: true
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 3600
    CreateResult:
      type: object
      required: [video_id, status]
      properties:
        video_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/VideoStatus"
    PublishResult:
      type: object
      required: [video_id, status]
      properties:
        video_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/VideoStatus"
    VideoStatus:
      type: string
      enum: [UPLOADING, PROCESSING, PENDING_REVIEW, PUBLISHED, FAILED, BLOCKED, DELETED]

    FeedItem:
      type: object
      required: [video_id, author_id, title, video_url, duration_seconds, author, like_count]
      properties:
        video_id:
          type: integer
          format: int64
        author_id:
          type: integer
          format: int64
        title:
          type: string
        cover_url:
          type: string
          nullable: true
        video_url:
          type: string
          description: 预签名播放 URL（2 小时有效）
        duration_seconds:
          type: integer
        published_at:
          type: string
          format: date-time
          nullable: true
        author:
          $ref: "#/components/schemas/AuthorRef"
        like_count:
          type: integer
          format: int64
          description: 点赞数（现查，准实时）
    AuthorRef:
      type: object
      required: [user_id, username, avatar_url]
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        avatar_url:
          type: string
          nullable: true
          description: 预签名 URL（7 天有效）
    FeedResult:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    VideoDetail:
      type: object
      required: [video_id, author_id, title, video_url, duration_seconds, status,
        created_at, author, like_count, is_liked]
      properties:
        video_id:
          type: integer
          format: int64
        author_id:
          type: integer
          format: int64
        title:
          type: string
        video_url:
          type: string
        duration_seconds:
          type: integer
        status:
          $ref: "#/components/schemas/VideoStatus"
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        author:
          $ref: "#/components/schemas/AuthorRef"
        like_count:
          type: integer
          format: int64
        is_liked:
          type: boolean
          description: 当前用户是否已点赞（匿名 false）
    VideoListItem:
      type: object
      properties:
        video_id:
          type: integer
          format: int64
        title:
          type: string
        video_url:
          type: string
        cover_url:
          type: string
          nullable: true
        duration_seconds:
          type: integer
        status:
          $ref: "#/components/schemas/VideoStatus"
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    VideoListResult:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VideoListItem"
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    LikeResult:
      type: object
      properties:
        video_id:
          type: integer
          format: int64
        liked:
          type: boolean

    CreateProductRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        cover_key:
          type: string
          nullable: true
          description: MinIO key，来自图片上传凭证
    ChangeStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ProductStatus"
    ProductStatus:
      type: string
      enum: [ON_SALE, OFF_SALE, DELETED]
    ProductItem:
      type: object
      required: [product_id, merchant_id, title, description, cover_url, status,
        created_at, updated_at]
      properties:
        product_id:
          type: integer
          format: int64
        merchant_id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        cover_url:
          type: string
          nullable: true
          description: 预签名 URL（短时效），直接用于展示
        status:
          $ref: "#/components/schemas/ProductStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductListResult:
      type: object
      required: [items, next_before_id, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductItem"
        next_before_id:
          type: integer
          format: int64
          nullable: true
          description: 下一页请求携带的游标（本页最后一条 ID；null 表示没有下一页）
        has_more:
          type: boolean
    CreateSKURequest:
      type: object
      required: [price]
      properties:
        spec:
          type: string
          description: 规格描述，如“黑色 / L”，可为空（单规格商品）
        price:
          type: integer
          format: int64
          minimum: 1
          description: 单价，单位分
    ChangeSKUStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/SkuStatus"
    SkuStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    SKUItem:
      type: object
      required: [sku_id, product_id, spec, price, status, created_at, updated_at]
      properties:
        sku_id:
          type: integer
          format: int64
        product_id:
          type: integer
          format: int64
        spec:
          type: string
        price:
          type: integer
          format: int64
          description: 单价，单位分
        status:
          $ref: "#/components/schemas/SkuStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductDetail:
      type: object
      allOf:
        - $ref: "#/components/schemas/ProductItem"
        - type: object
          required: [skus]
          properties:
            skus:
              type: array
              description: 在售（ACTIVE）SKU 列表；已停用规格不对外暴露
              items:
                $ref: "#/components/schemas/SKUItem"
    AdjustStockRequest:
      type: object
      required: [change, idempotency_key]
      properties:
        change:
          type: integer
          format: int64
          description: 正数入库、负数扣减；扣减超过当前库存返回 409 INSUFFICIENT_STOCK
        idempotency_key:
          type: string
          description: 客户端生成，同一 key 重复提交不重复变更（幂等重放返回当前库存）
    StockView:
      type: object
      required: [sku_id, quantity]
      properties:
        sku_id:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time
          nullable: true
    PlayRequest:
      type: object
      required: [event_id]
      properties:
        event_id:
          type: string
          format: uuid
          description: 客户端生成 UUID v7，幂等去重
        session_id:
          type: string
          nullable: true
          description: 会话标识（可选，防同一会话刷量的统计维度）
        played_at:
          type: string
          format: date-time
          nullable: true
          description: 客户端事件时间 RFC3339，缺省服务端 now()
    FollowResult:
      type: object
      properties:
        followee_id:
          type: integer
          format: int64
        following:
          type: boolean
