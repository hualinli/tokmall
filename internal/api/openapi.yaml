openapi: 3.0.3
info:
  title: TokMall API
  description: 短视频 Feed + 商城一体化后端（学习项目）。
    本文件是 API 契约的唯一事实源，由 openapi_sync_test 保证与代码同步。
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: 本地开发

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 认证（公开）
  - name: feed
    description: 全局 Feed（公开）
  - name: videos
    description: 视频管理（需认证）
  - name: interactions
    description: 点赞/关注（需认证）
  - name: user
    description: 个人资料（需认证）
  - name: products
    description: 商品与库存
  - name: orders
    description: 订单（需认证）
  - name: promotions
    description: 视频挂商品推广关系
  - name: attribution
    description: 作者带货归因统计
  - name: health
    description: 探针（公开）

paths:
  /health/live:
    get:
      tags: [health]
      summary: 存活探针
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      tags: [health]
      summary: 就绪探针（检查 DB 连通）
      responses:
        "200":
          description: 依赖就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/v1/docs/openapi.yaml:
    get:
      tags: [health]
      summary: 本 OpenAPI 规范文件本身
      security: []
      responses:
        "200":
          description: 原始 YAML
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: 注册（注册即签发 token 对）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "409":
          $ref: "#/components/responses/DuplicateAction"
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录（identifier 接受 email 或 username）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新 token（rotation：旧 refresh token 被拉黑）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 新的 token 对
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 登出（幂等：无效/过期 token 视为已登出）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: 登出成功
        "400":
          $ref: "#/components/responses/InvalidArgument"

  /api/v1/feed:
    get:
      tags: [feed]
      summary: 全局时间排序 Feed（首页走缓存，翻页用 cursor）
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页已发布视频
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"

  /api/v1/feed/following:
    get:
      tags: [feed]
      summary: 关注 Feed（完整时间线，按发布时间倒序，需登录）
      description: 返回全部关注作者的已发布视频，按 (published_at,id) 倒序游标分页，不按作者截断。生产接口仅支持与签名时间游标一致的发布时间排序；HotRanker 仅保留为内部排序实验，未开放为可翻页接口。
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页关注作者的已发布视频
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/me:
    get:
      tags: [user]
      summary: 当前用户资料（含 email，仅自己可见）
      responses:
        "200":
          description: 用户资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/UserNotFound"
    patch:
      tags: [user]
      summary: 更新自己的资料（bio / avatar_key，局部更新语义）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: 更新后的完整资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/users/{id}:
    get:
      tags: [user]
      summary: 公开用户资料（可选认证：带 token 时 is_following 个性化）
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: 公开资料（不含 email）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /api/v1/users/{id}/videos:
    get:
      tags: [feed]
      summary: 公开作者主页：已发布作品列表（FeedItem 结构，游标分页）
      security: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 该作者的已发布视频
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"

  /api/v1/users/{id}/following:
    get:
      tags: [interactions]
      summary: 关注列表（可选认证：is_following 个性化）
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 关注的人（按关系时间倒序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileListResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/UserNotFound"
  /api/v1/users/{id}/followers:
    get:
      tags: [interactions]
      summary: 粉丝列表（可选认证：is_following 个性化，回关按钮数据）
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 粉丝（按关系时间倒序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileListResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /api/v1/videos/upload-url:
    post:
      tags: [videos]
      summary: 申请预签名上传 URL（含票证防伪造）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadURLRequest"
      responses:
        "200":
          description: 预签名 PUT URL（15 分钟有效）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/videos:
    post:
      tags: [videos]
      summary: 创建视频记录（需先上传文件到 object_key）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoRequest"
      responses:
        "201":
          description: 创建成功（PENDING_REVIEW）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateResult"
        "400":
          description: 参数非法或上传凭证过期/伪造
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/videos/me:
    get:
      tags: [videos]
      summary: 我的视频列表（管理视图，含未发布；按创建时间倒序）
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 作者自己的视频列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoListResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/videos/{id}:
    get:
      tags: [videos]
      summary: 视频详情（公开可看；可见性：DELETED 404，未发布仅作者；is_liked 可选认证）
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "200":
          description: 详情（video_url 为预签名播放 URL，2 小时有效）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoDetail"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/VideoNotFound"
    delete:
      tags: [videos]
      summary: 删除视频（软删 + 删除 MinIO 对象，旧 URL 立即失效）
      description: >-
        非作者与视频不存在统一返回 404：视频 ID 是自增序列，403 会变成
        "该 ID 存在但不属于你"的存在性预言机，与不可见资源一律 404 的约定冲突。
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "204":
          description: 删除成功
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/VideoNotFound"
        "409":
          $ref: "#/components/responses/DuplicateAction"
  /api/v1/videos/{id}/publish:
    post:
      tags: [videos]
      summary: 发布视频（PENDING_REVIEW -> PUBLISHED，条件更新防并发）
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "200":
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/VideoNotFound"
        "409":
          $ref: "#/components/responses/DuplicateAction"
  /api/v1/videos/{id}/play:
    post:
      tags: [videos]
      summary: 上报播放事件（event_id UUID 幂等；仅相同业务载荷重放成功）
      parameters:
        - $ref: "#/components/parameters/VideoID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayRequest"
      responses:
        "204":
          description: 事件已接收（相同 event_id 且业务载荷一致的重放同样 204，不重复计数）
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/VideoNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /api/v1/videos/{id}/like:
    post:
      tags: [interactions]
      summary: 点赞（幂等：重复点赞返回相同结果）
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "200":
          description: 点赞结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/VideoNotFound"
    delete:
      tags: [interactions]
      summary: 取消点赞（幂等）
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "200":
          description: 取消点赞结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/VideoNotFound"
  /api/v1/users/{id}/follow:
    post:
      tags: [interactions]
      summary: 关注（幂等，禁止自关注）
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: 关注结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/UserNotFound"
    delete:
      tags: [interactions]
      summary: 取消关注（幂等）
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: 取消关注结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /api/v1/products:
    post:
      tags: [products]
      summary: 创建商品（商家；初始 ON_SALE）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "200":
          description: 创建成功（cover_url 为预签名 URL，短时效）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductItem"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    get:
      tags: [products]
      summary: 我的商品列表（商家管理视图，不含已删除；id 倒序 + before_id 游标）
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/BeforeID"
        - name: status
          in: query
          description: 状态过滤（缺省返回全部非删除状态）
          schema:
            type: string
            enum: [ON_SALE, OFF_SALE]
        - name: keyword
          in: query
          description: 标题模糊匹配
          schema:
            type: string
      responses:
        "200":
          description: 商品列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/products/search:
    get:
      tags: [products]
      summary: 商品搜索（用户侧，仅 ON_SALE；匿名可用）
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/BeforeID"
        - name: keyword
          in: query
          description: 标题模糊匹配（可选，缺省浏览全部在售商品）
          schema:
            type: string
      responses:
        "200":
          description: 在售商品列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"

  /api/v1/products/{id}:
    get:
      tags: [products]
      summary: 商品详情（公开可看；DELETED 对外 404；skus 仅含在售规格）
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProductID"
      responses:
        "200":
          description: 商品详情（含在售 SKU 列表）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/ProductNotFound"

  /api/v1/products/{id}/status:
    post:
      tags: [products]
      summary: 变更商品状态（仅商家本人；ON_SALE/OFF_SALE 互转或软删 DELETED）
      parameters:
        - $ref: "#/components/parameters/ProductID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeStatusRequest"
      responses:
        "200":
          description: 状态变更成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductItem"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ProductNotFound"
  /api/v1/products/{id}/skus:
    post:
      tags: [products]
      summary: 给商品新增 SKU（仅商家本人；初始 ACTIVE）
      parameters:
        - $ref: "#/components/parameters/ProductID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSKURequest"
      responses:
        "201":
          description: 创建成功（价格为分）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SKUItem"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ProductNotFound"

  /api/v1/products/{id}/skus/{sku_id}/status:
    post:
      tags: [products]
      summary: 变更 SKU 状态（仅商家本人；ACTIVE/DISABLED 互转）
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/SkuID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeSKUStatusRequest"
      responses:
        "200":
          description: 状态变更成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SKUItem"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "409":
          description: 状态已被并发修改
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/products/{id}/skus/{sku_id}/stock:
    get:
      tags: [products]
      summary: 查询 SKU 库存（仅商家本人；未初始化按 0 返回）
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/SkuID"
      responses:
        "200":
          description: 当前库存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockView"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ProductNotFound"
    post:
      tags: [products]
      summary: 调整 SKU 库存（仅商家本人；正数入库、负数扣减；按 SKU + 操作 + idempotency_key 幂等）
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/SkuID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustStockRequest"
      responses:
        "200":
          description: 调整后的当前库存（重复 key 幂等重放也返回 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockView"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "409":
          description: 库存不足或幂等键复用时载荷不一致
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/videos/{id}/products:
    get:
      tags: [promotions]
      summary: 查询已发布视频启用中的商品卡（公开）
      description: 返回已发布视频的 ACTIVE 关系与非删除商品；下架商品保留卡片并标明状态，不能购买。不暴露库存，封面 URL 留待 Feed 批量装配。
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "200":
          description: 商品卡按 sort_order、关系 ID 稳定排序；视频不可见时返回空列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoProductCardList"
        "400":
          $ref: "#/components/responses/InvalidArgument"
    post:
      tags: [promotions]
      summary: 挂载或重新启用商品
      description: >-
        v1 尚无平台招商与选品授权，仅允许当前用户把自己已发布的视频挂到自己名下的在售商品。
        重复挂载同一商品会更新排序并重新启用；每个视频最多 5 个 ACTIVE 商品。
      parameters:
        - $ref: "#/components/parameters/VideoID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkVideoProductRequest"
      responses:
        "200":
          description: 挂载、幂等更新或重新启用成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoProductLink"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: 视频/商品不存在、越权、视频未发布或商品不在售（统一隐藏）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 视频已经达到 5 个启用商品上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/videos/{id}/products/{product_id}:
    patch:
      tags: [promotions]
      summary: 调整已挂商品排序
      parameters:
        - $ref: "#/components/parameters/VideoID"
        - $ref: "#/components/parameters/VideoProductID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVideoProductSortRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoProductLink"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: 关系或当前可管理资源不可见（统一 404）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [promotions]
      summary: 停用挂载关系
      description: 保留关系与历史归因；之后再次 POST 可重新启用。
      parameters:
        - $ref: "#/components/parameters/VideoID"
        - $ref: "#/components/parameters/VideoProductID"
      responses:
        "200":
          description: 停用成功（对已停用关系重复调用仍返回 DISABLED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoProductLink"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: 关系或当前可管理资源不可见（统一 404）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/orders:
    get:
      tags: [orders]
      summary: 当前买家订单列表（按 ID 倒序游标分页）
      parameters:
        - $ref: "#/components/parameters/OrderBeforeID"
        - $ref: "#/components/parameters/OrderLimit"
      responses:
        "200":
          description: 仅包含自己的订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [orders]
      summary: 创建单 SKU 订单
      description: >-
        当前用户身份只取自 Bearer Token。创建订单、条件扣库存、库存流水和订单项在同一事务提交；
        同一用户使用相同 idempotency_key 和相同载荷重试时返回同一订单，且仍返回 201。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: 创建成功或相同载荷的幂等重放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: SKU 不可售或完整来源关系无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 库存不足，或幂等键已被不同请求载荷占用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/orders/{id}:
    get:
      tags: [orders]
      summary: 当前买家查看订单详情
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: 订单详情及下单时商品快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OrderNotFound"

  /api/v1/merchant/orders:
    get:
      tags: [orders]
      summary: 当前商家订单列表
      parameters:
        - $ref: "#/components/parameters/OrderBeforeID"
        - $ref: "#/components/parameters/OrderLimit"
      responses:
        "200":
          description: 仅包含自己的商品订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/merchant/orders/{id}:
    get:
      tags: [orders]
      summary: 当前商家查看订单详情
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: 订单详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OrderNotFound"

  /api/v1/merchant/orders/{id}/fulfill:
    post:
      tags: [orders]
      summary: 商家确认模拟发货（PAID → FULFILLING）
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: 状态变更或相同操作重放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderTransitionResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          $ref: "#/components/responses/OrderStateConflict"

  /api/v1/orders/{id}/complete:
    post:
      tags: [orders]
      summary: 买家确认完成（FULFILLING → COMPLETED）
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: 状态变更或相同操作重放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderTransitionResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          $ref: "#/components/responses/OrderStateConflict"

  /api/v1/orders/{id}/pay:
    post:
      tags: [orders]
      summary: 模拟当前用户支付订单
      description: >-
        仅用于学习环境的受保护用户命令，不是支付渠道回调。订单必须属于当前 Bearer Token 用户；
        不存在与非本人订单统一返回 404。真实渠道回调必须使用独立入口，并先校验渠道签名、时间窗和防重放。
        超过 expires_at 的订单会被拒绝（409 ORDER_EXPIRED），支付事务同时完成关单与库存回补
        （lazy expiry），不依赖超时关单 Worker 的调度窗口。
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayOrderRequest"
      responses:
        "200":
          description: 支付成功或相同支付事实的幂等重放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayOrderResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          description: >-
            金额不一致（PAYMENT_AMOUNT_MISMATCH）、订单状态冲突（ORDER_STATE_CONFLICT）、
            订单已超时（ORDER_EXPIRED），或支付标识被不同事实占用（IDEMPOTENCY_CONFLICT）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/orders/{id}/cancel:
    post:
      tags: [orders]
      summary: 当前用户取消订单
      description: >-
        仅允许订单本人取消。取消订单、库存回补和回补流水在同一事务提交；
        对已取消订单重复请求返回原结果，不重复回补库存。
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: 取消成功或幂等重放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelOrderResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          description: 订单已支付、已过期或处于其他不可取消状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/orders/{id}/refund:
    post:
      tags: [orders]
      summary: 买家对已支付订单申请全额退款
      description: >-
        仅订单本人可申请。可申请状态为 PAID（已付款未发货）与 FULFILLING（已发货待收货）；
        PENDING_PAYMENT/COMPLETED/CANCELED/EXPIRED 返回 409。同一订单同时最多存在一笔
        未决或已成功的退款：重复申请返回原退款单（replayed=true），不产生第二笔售后事实。
        退款金额由订单事实决定，不接受客户端提交。
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestRefundRequest"
      responses:
        "201":
          description: 申请成功或相同售后事实的幂等重放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundDetail"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          description: 当前订单状态不允许退款
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [orders]
      summary: 买家查看订单最新一笔退款
      description: 订单不存在或不属于当前用户统一返回 404；该订单没有退款单时同样返回 404。
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: 退款单详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/RefundNotFound"

  /api/v1/merchant/orders/{id}/refund:
    get:
      tags: [orders]
      summary: 商家查看订单最新一笔退款
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: 退款单详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/RefundNotFound"

  /api/v1/merchant/orders/{id}/refund/approve:
    post:
      tags: [orders]
      summary: 商家同意退款
      description: >-
        仅订单所属商家可裁决。同意后订单进入终态 REFUNDED：未发货（PAID）退款回补库存并写
        ORDER_REFUNDED 流水；已发货（FULFILLING）退款不回补库存。重复同意返回原结果（replayed=true）。
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideRefundRequest"
      responses:
        "200":
          description: 退款成功或幂等重放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundDetail"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          description: 没有待裁决的退款，或退款已完成无法再次裁决
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/merchant/orders/{id}/refund/reject:
    post:
      tags: [orders]
      summary: 商家拒绝退款
      description: >-
        拒绝后订单退回申请前状态（PAID 可继续发货，FULFILLING 可继续确认收货），
        退款单进入终态 REJECTED，买家可以再次申请。
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideRefundRequest"
      responses:
        "200":
          description: 拒绝成功或幂等重放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundDetail"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          description: 没有待裁决的退款，或退款已完成无法再次裁决
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/authors/{id}/sales:
    get:
      tags: [attribution]
      summary: 查看自己的已支付带货统计
      description: 仅作者本人可查看；基于订单创建时的来源快照与支付事实实时聚合。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: 作者带货统计
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorSales"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/UserNotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      description: 每页条数，默认 20，合法范围 1-100
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      description: 上一页返回的签名游标（无则取第一页）
      schema:
        type: string
    VideoID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProductID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VideoProductID:
      name: product_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    BeforeID:
      name: before_id
      in: query
      description: 上一页最后一条的商品 ID（无则取第一页）
      schema:
        type: integer
        format: int64
    SkuID:
      name: sku_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OrderID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    OrderBeforeID:
      name: before_id
      in: query
      description: 上一页最后一笔订单 ID
      schema:
        type: integer
        format: int64
        minimum: 1
    OrderLimit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 50
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    InvalidArgument:
      description: 参数非法（details 指明字段）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: 未认证或凭证无效（token 缺失/过期/黑名单）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    VideoNotFound:
      description: 视频不存在或不可见（404 不泄露存在性）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UserNotFound:
      description: 用户不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProductNotFound:
      description: 商品不存在或不可见（404 不泄露存在性）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrderNotFound:
      description: 订单不存在或不属于当前买家/商家（统一 404，不泄露存在性）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RefundNotFound:
      description: 订单没有退款单，或订单不属于当前买家/商家（统一 404，不泄露存在性）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrderStateConflict:
      description: 订单不处于允许的状态
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DuplicateAction:
      description: 重复操作（邮箱/用户名已存在、状态冲突）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdempotencyConflict:
      description: 幂等键已被不同业务载荷占用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: 统一错误结构
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_ARGUMENT, INVALID_CURSOR, VIDEO_NOT_FOUND, VIDEO_NOT_PUBLISHED,
                USER_NOT_FOUND, PRODUCT_NOT_FOUND, INSUFFICIENT_STOCK, ORDER_NOT_FOUND,
                ORDER_STATE_CONFLICT, PAYMENT_AMOUNT_MISMATCH, UNAUTHENTICATED,
                FORBIDDEN, RATE_LIMITED, DUPLICATE_ACTION, IDEMPOTENCY_CONFLICT,
                VIDEO_PRODUCT_LIMIT, VIDEO_PRODUCT_NOT_FOUND,
                UPLOAD_URL_EXPIRED, INTERNAL,
                DEPENDENCY_UNAVAILABLE, MISSING_AUTH_HEADER, INVALID_AUTH_TYPE, INVALID_TOKEN]
            message:
              type: string
            details:
              type: object
        request_id:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string

    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          pattern: "^[a-zA-Z][a-zA-Z0-9]{5,15}$"
          description: 字母开头，5-15 位字母数字
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8-72 字节（bcrypt 上限）
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: email 或 username
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    AuthResult:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token:
          type: string
          description: JWT，15 分钟有效
        refresh_token:
          type: string
          description: JWT，7 天有效；刷新后旧 token 立即失效
        expires_in:
          type: integer
          format: int64
          description: access_token 剩余秒数
        user:
          $ref: "#/components/schemas/PublicUser"
    PublicUser:
      type: object
