name: Security

# 安全门禁：govulncheck（依赖/标准库的**可达**已知漏洞）+ CodeQL（Go 数据流静态分析）。
# 与 ci.yml 分开的原因：安全问题往往不是本次改动引入的（新 CVE 随时公开），
# 所以除了 push/PR，还要每周定时全量扫一次——定时任务不受 paths-ignore 影响。

on:
  push:
    branches: [main]
    # 纯文档改动不触发扫描（openapi.yaml 之类非 .md 文件照常触发）
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  schedule:
    # 每周一 03:00 UTC：即使没有任何代码改动，也重新对一次公开漏洞库
    - cron: '0 3 * * 1'

jobs:
  govulncheck:
    name: 依赖漏洞扫描（govulncheck）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 安装 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: 扫描（存在可达漏洞即失败）
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  codeql:
    name: CodeQL（Go）
    runs-on: ubuntu-latest
    # CodeQL 首次建库 + 分析可能很久：显式写死上限（360 分钟 = GitHub 默认上限），
    # 免得以后被人当成普通 job 调到 20 分钟而砍在半路
    timeout-minutes: 360
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: 构建（CodeQL 需要编译产物；比 autobuild 更确定）
        run: go build ./...
      - name: 分析并上传结果
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
