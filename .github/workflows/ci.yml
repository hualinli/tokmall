name: CI

# 每次推送和 PR 都跑：编译、单元测试、竞态、真实依赖集成测试、契约同步、
# 前端类型/构建/单测。CI 的价值不是"绿了就行"，而是把本项目所有可自动化的
# 结论（并发不超卖、幂等、对账、契约不漂移）变成不可绕过的门禁。

# 最小权限：CI 只读代码。任何需要写权限的动作（发布、评论）都不在这里做。
permissions:
  contents: read

# 同一分支连推多次时取消上一轮未跑完的任务：省 runner，也让最新提交才是权威。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    # 纯文档改动（*.md、docs/）不触发重活；openapi.yaml 不在排除范围内，
    # 所以契约改动依旧会跑 contract job。
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

env:
  NODE_VERSION: "22"
  # 集成测试显式开关：默认关闭，CI 里打开（与服务容器一起提供真实依赖）。
  TOKMALL_RUN_PG_INTEGRATION: "1"
  TOKMALL_RUN_REDIS_INTEGRATION: "1"
  TOKMALL_TEST_DATABASE_DSN: "host=127.0.0.1 user=tokmall password=tokmall dbname=tokmall port=5432 sslmode=disable"
  TOKMALL_TEST_REDIS_ADDR: "127.0.0.1:6379"

jobs:
  backend:
    name: 后端（编译 / 单测 / 竞态 / 集成）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tokmall
          POSTGRES_PASSWORD: tokmall
          POSTGRES_DB: tokmall
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tokmall"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Go 版本以 go.mod 为唯一事实来源，避免工作流和工作流之间版本漂移
          go-version-file: go.mod
          cache: true
      - name: 格式检查（gofmt）
        # 不做自动修复：只列文件并失败，让贡献者自己跑 make fmt（CI 不回写仓库）
        run: |
          gofmt -l . | tee /tmp/fmt.txt
          test ! -s /tmp/fmt.txt || (echo '请运行 make fmt' && exit 1)
      - name: go.mod / go.sum 与 go mod tidy 一致
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo '❌ go.mod/go.sum 有 tidy 漂移：请在本地运行 make tidy 并提交结果';
            exit 1;
          }
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        # 版本钉死（不用 latest）：上游发版把历史 PR 变红是对照项目踩过的坑。
        # 配置见 .golangci.yml——精选 linter，重点是 errorlint/nilerr/forcetypeassert：
        # 它们直接对应本项目"三层错误链 + 领域哨兵"的约定。
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: 单元测试
        run: go test ./... -count=1
      - name: 竞态检测（并发密集模块）
        run: go test -race ./internal/order/ ./internal/user/ ./internal/feed/ ./internal/interaction/ ./internal/inventory/ ./cmd/... -count=1
      - name: 真实 PostgreSQL + Redis 集成测试（含并发证明与对账）
        run: |
          go test ./internal/order/ -run TestPostgres -count=1 -v
          go test ./internal/user/ -run TestPostgres -count=1
          go test ./internal/outbox/ -count=1 -v
          go test ./internal/reconcile/ -count=1 -v
      - name: 构建（api / outboxctl / reconcile）
        run: |
          go build -o bin/api ./cmd/api
          go build -o bin/outboxctl ./cmd/outboxctl
          go build -o bin/reconcile ./cmd/reconcile

  contract:
    name: 契约（OpenAPI ↔ 路由同步）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 路由与契约双向同步
        run: go test ./cmd/api/ -run TestOpenAPISync -count=1 -v
      - name: 每个操作都必须有 summary（契约可读性门禁）
        run: go test ./internal/api/ -count=1 -v

  web:
    name: 前端（类型 / 契约漂移 / 构建 / 单测）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: 生成类型与路由
        working-directory: web
        run: pnpm gen
      - name: 生成物必须与契约一致（漂移即失败）
        run: git diff --exit-code -- web/src/api/types.ts web/src/routeTree.gen.ts
      - name: 类型检查
        working-directory: web
        run: pnpm typecheck
      - name: Lint
        working-directory: web
        run: pnpm lint
      - name: 单元测试
        working-directory: web
        run: pnpm test -- --run
      - name: 构建
        working-directory: web
        run: pnpm build

  e2e:
    name: 端到端（Playwright）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tokmall
          POSTGRES_PASSWORD: tokmall
          POSTGRES_DB: tokmall
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tokmall"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 启动对象存储（MinIO）
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=tokmall -e MINIO_ROOT_PASSWORD=tokmall123 \
            minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      # e2e 使用合成上传文件；媒体准入由后端真实探测/仓储集成测试覆盖。
      - name: 启动后端
        run: |
          go build -o bin/api ./cmd/api
          APP_ENV=development \
            JWT_SECRET=ci-jwt-secret-for-e2e-run-only \
            FEED_CURSOR_SECRET=ci-cursor-secret-for-e2e-run-only \
            DB_PORT=5432 REDIS_ADDR=127.0.0.1:6379 \
            MEDIA_PROBE_ENABLED=false \
            MINIO_ENDPOINT=localhost:9000 \
            nohup ./bin/api > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health/ready && break; sleep 1; done
      - name: 安装依赖与浏览器
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: 运行 e2e
        working-directory: web
        run: pnpm test:e2e
      - name: 失败时输出后端日志
        if: failure()
        run: tail -200 api.log
